# Local development stack. Production runs the same image on AWS Lightsail with a managed
# PostgreSQL database (Phase 2, Q7.3): the api container plus one worker container.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      UVICORN_RELOAD: "true"
      # Integration tests fail (instead of skipping) if PostgreSQL is unreachable.
      REQUIRE_POSTGRES: "1"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./app:/srv/app
      - ./alembic:/srv/alembic
      - ./tests:/srv/tests
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Background worker: monitoring-gap sweeps (REQ-02) and webhook delivery (REQ-04). Same image;
  # starts after the api has applied migrations. A database lock keeps a second copy on standby.
  worker:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - ./app:/srv/app
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
