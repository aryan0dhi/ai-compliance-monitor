[project]
name = "ai-compliance-monitor"
version = "0.1.0"
description = "Post-market monitoring service for high-risk AI systems (EU AI Act Art. 72-73)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "pydantic-settings>=2.4,<3",
    # Webhook delivery (REQ-04).
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
# GET /test/report code coverage in a test deployment (app/modules/testing/code_coverage.py).
coverage = ["coverage>=7.6"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "schemathesis>=4.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a reachable PostgreSQL (run inside docker compose)",
    "fuzz: Schemathesis schema-driven fuzzing (slower)",
    "contract: black-box Section 5 suite run against a live service (CONTRACT_BASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.coverage.run]
source = ["app"]
# Save data when a container is stopped (server-side coverage of a cross-team run, see
# docs/cross-team-testing.md).
sigterm = true

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["app", "tests/fakes.py"]
